<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Descubrí canciones, versiones y artistas conectados con MusiKit." />
    <title>MusiKit — Toda la música está conectada</title>
    <script>
      try {
        var theme = localStorage.getItem('musikit-theme-v1');
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (_) {
        document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
